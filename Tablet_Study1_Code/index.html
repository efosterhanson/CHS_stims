<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Sprouts</title>

    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" />
    <script src="https://unpkg.com/jspsych@8.3.0/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-video-button-response@2.1.0/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-video-hotspots@1.1.0/dist/index.browser.min.js"></script>

    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { font-family: system-ui, sans-serif; background: #eef4ec; color: #173a2e; }
      [hidden] { display: none !important; }

      #start-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      #start-screen h1 { margin: 0 0 12px; font-size: clamp(2.5rem, 7vw, 4rem); }
      #start-screen p { max-width: 32rem; margin: 0 0 24px; line-height: 1.5; }
      button {
        min-height: 52px;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        background: #173a2e;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #study-target {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: black;
      }
      #study-target .jspsych-content-wrapper,
      #study-target .jspsych-content {
        width: 100%;
        height: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
      }
      #study-target .jspsych-content-wrapper,
      #study-target .jspsych-content {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #study-target .jspsych-content { flex-direction: column; }
      #study-target #jspsych-video-button-response-stimulus {
        display: block;
        margin-inline: auto;
        max-width: 100vw;
        max-height: 100dvh;
        width: auto;
        height: auto;
      }
      #study-target.yes-no-trial #jspsych-video-button-response-stimulus {
        max-height: calc(100dvh - 110px);
      }
      #study-target.yes-no-trial #jspsych-video-button-response-btngroup {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 16px;
      }
      #study-target.yes-no-trial #jspsych-video-button-response-btngroup button {
        min-width: clamp(120px, 25vw, 180px);
        min-height: 64px;
        font-size: 1.4rem;
      }
      #study-target #jspsych-video-hotspots-stimulus {
        display: block;
        width: 1280px;
        height: 720px;
        max-width: none;
        max-height: none;
      }
      #study-target #jspsych-video-hotspots-container { margin: auto; }
      .jspsych-video-hotspots-hotspot { touch-action: manipulation; }
      .jspsych-video-hotspots-hotspot[data-hotspot-id="other"] { cursor: default !important; }
      .complete { padding: 32px; color: white; text-align: center; }
      .complete h2 { margin-top: 0; }
    </style>
  </head>

  <body>
    <main id="start-screen">
      <div>
        <h1>Project Sprouts</h1>
        <p>This build plays through the closing message. Turn on the sound, then start when ready.</p>
        <button id="start-button" type="button">Start study</button>
      </div>
    </main>

    <div id="study-target" hidden></div>

    <script src="experiment.js"></script>
  </body>
</html>
